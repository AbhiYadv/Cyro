[package]
name = "cyro"
version = "0.0.0"
description = "Cyro Sprint 0 desktop shell"
authors = ["Cyro"]
edition = "2021"

[lib]
name = "cyro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["unstable"] }
